# PicGo-Web 部署（默认 SQLite）
#
# 面向用户的**唯一官方**部署方式（docs/DECISIONS.md D76）。
#
#   mkdir picgo-web && cd picgo-web
#   curl -O https://raw.githubusercontent.com/YeqingKy/PicGo-Web/main/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/YeqingKy/PicGo-Web/main/.env.example
#   # 编辑 .env（至少确认 PICGO_WEB_LISTEN 与 PICGO_WEB_DATA_DIR）
#   docker compose up -d
#
# 切 PostgreSQL：追加覆盖文件
#   docker compose -f docker-compose.yml -f docker-compose.pgsql.yml up -d

services:
  picgo-web:
    image: ghcr.io/yeqingky/picgo-web:latest
    # 从源码构建时启用（需要仓库根目录存在 Dockerfile，见 W9）
    # build:
    #   context: .
    #   dockerfile: deploy/docker/Dockerfile
    container_name: picgo-web
    restart: unless-stopped

    # 注意：这里**只放启动引导类变量**。
    # 其余业务配置一律在后台界面改（存数据库）。
    # 数据库连接等按需从 .env 注入；不要把业务配置写进 environment，
    # 否则会覆盖数据库里的值（环境变量优先级更高，见 D18 三级分层）。
    environment:
      PICGO_WEB_LISTEN: "0.0.0.0:8080"
      PICGO_WEB_DATA_DIR: "/data"
      PICGO_WEB_DB_DRIVER: "sqlite"
      PICGO_WEB_LOG_LEVEL: "info"
      GIN_MODE: "release"
      TZ: "Asia/Shanghai"

    # 敏感值与数据库配置从 .env 读取（不在这里明文写）
    env_file:
      - .env

    ports:
      # 只绑回环时改为 "127.0.0.1:8080:8080"，由前置反向代理对外
      - "8080:8080"

    volumes:
      # ⚠️ 这一切就是全部状态：数据库 + 主密钥 + 上传暂存 + picgo 配置 + 主题
      # 备份整个目录即完成备份（D82：本项目不提供导出/导入功能）
      - ./data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # agent 由 Go 在容器内拉起（PICGO_WEB_AGENT_AUTOSTART 默认 true），
    # 因此不需要额外的 service。若拆分为两个容器，把该变量设为 false
    # 并单独部署 picgo-agent，见 README「其他部署方式」。

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
