# PicGo-Web 生产部署（默认 SQLite）
#
# ⚠️ 本项目**只提供 docker compose 部署**（D76）。
#    开发环境见 `docker-compose-dev.yml`（`make dev`）。
#
# 快速开始：
#   cp .env.example .env      # 按需修改（至少确认监听地址与数据目录）
#   docker compose up -d      # 首次会自动构建镜像（约 1~2 分钟）
#   打开 http://localhost:8080
#
# 切 PostgreSQL：
#   docker compose -f docker-compose.yml -f docker-compose.pgsql.yml up -d
#
# 管理员初始密码：容器日志里的 WARN 行，或 data/initial-admin-password.txt

services:
  picgo-web:
    # 同时给 image 与 build：
    #   · 本地没有镜像时，`docker compose up -d` 会自动按 build 构建
    #   · 已有官方镜像时可跳过构建（`docker compose pull` 后 up）
    #   · `docker compose up -d --build` 强制重新构建
    image: ghcr.io/yeqingky/picgo-web:latest
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile

    container_name: picgo-web
    restart: unless-stopped

    # ⚠️ 这里**只放启动引导类变量**（见 docs/DECISIONS.md D18 三级分层）。
    #    业务配置（站点信息、上传限制、SMTP、OAuth、限流、日志保留…）
    #    一律在**后台界面**里改 —— 它们存在数据库里，改完立即生效、无需重启。
    #    若在这里设置同名变量，会**覆盖**数据库里的值（环境变量优先级最高），
    #    导致「后台改了没效果」这类困惑。
    environment:
      PICGO_WEB_LISTEN: "0.0.0.0:8080"
      PICGO_WEB_DATA_DIR: "/data"
      PICGO_WEB_DB_DRIVER: "sqlite"
      PICGO_WEB_LOG_LEVEL: "info"
      # 侧车由 Go 拉起并管理（令牌生成、健康探测、退避重启、优雅关停）
      PICGO_WEB_AGENT_AUTOSTART: "true"
      PICGO_WEB_AGENT_URL: "http://127.0.0.1:36678"
      GIN_MODE: "release"
      TZ: "Asia/Shanghai"

    # 数据库连接、加密主密钥、agent 令牌等敏感项从 .env 读取
    env_file:
      - .env

    ports:
      # 只给本机反向代理时改为 "127.0.0.1:8080:8080"
      - "8080:8080"

    volumes:
      # 这一切就是全部状态：数据库 + 主密钥 + 上传暂存 + picgo 配置 + 主题
      # 备份整个目录即完成备份（D82：本项目不提供导出/导入功能）
      - ./data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要建库 + 迁移 + 拉起 Node 侧车，给足启动时间
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
